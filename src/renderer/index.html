<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>风灵月影宗</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- 尽早应用主题，避免启动闪烁：优先用户手动选择，未选择过则跟随系统外观 -->
    <script>
      (function () {
        var saved = localStorage.getItem('app-theme');
        var systemDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
      })();
    </script>
  </head>
  <body>
    <!-- 自定义标题栏 -->
    <div class="title-bar">
      <div class="title-bar-left">
        <img src="./public/pic/app-icon-dark.png" alt="图标" class="title-bar-icon" />
        <span class="title-bar-text">风灵月影宗</span>
      </div>
      <div class="title-bar-right">
        <button class="title-bar-btn theme-toggle" id="theme-toggle-btn" aria-label="切换日间/夜间模式，长按跟随系统">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="5"></circle>
            <line x1="12" y1="1" x2="12" y2="3"></line>
            <line x1="12" y1="21" x2="12" y2="23"></line>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
            <line x1="1" y1="12" x2="3" y2="12"></line>
            <line x1="21" y1="12" x2="23" y2="12"></line>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
          </svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
          <span class="tip">
            <span class="tip-action">切换到日间模式</span><br />
            <span class="tip-hint">长按切换到跟随系统</span>
          </span>
        </button>
        <button class="title-bar-btn minimize" id="minimize-btn" title="最小化">−</button>
        <button class="title-bar-btn maximize" id="maximize-btn" title="最大化">◻</button>
        <button class="title-bar-btn close" id="close-btn" title="关闭">✕</button>
      </div>
    </div>

    <div class="container">
      <!-- 左侧边栏 -->
      <div class="sidebar">
        <ul class="menu">
          <li><a href="#home" class="nav-link active" data-page="home">首页</a></li>
          <li><a href="#all-games" class="nav-link" data-page="all-games">搜索</a></li>
          <li><a href="#cheats" class="nav-link" data-page="cheats">我的修改器</a></li>
          <li><a href="#settings" class="nav-link" data-page="settings">设置</a></li>
          <li><a href="#about" class="nav-link" data-page="about">关于</a></li>
        </ul>
      </div>

      <!-- 主内容区 -->
      <div class="main-content">
        <!-- 首页 -->
        <div id="home" class="page">
          <!-- 欢迎内容 -->
          <div id="welcome-content"></div>
          <!-- 最近更新区域 -->
          <div class="recent-updates-section">
            <div class="section-header">
              <h3>最近更新</h3>
              <button id="refresh-recent-updates-btn" class="btn refresh-btn" title="更新数据">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M23 4v6h-6"></path>
                  <path d="M1 20v-6h6"></path>
                  <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
                </svg>
              </button>
            </div>
            <div id="recent-updates-list" class="game-list"></div>
          </div>
        </div>

        <!-- 所有游戏/搜索 -->
        <div id="all-games" class="page hidden">
          <h2>搜索</h2>
          <div class="search-section">
            <div class="search-bar">
              <div class="search-input-wrapper">
                <input type="text" id="all-games-search" placeholder="搜索游戏修改器..." />
                <span id="all-games-clear-search" class="clear-search">&times;</span>
              </div>
              <button id="all-games-search-btn" class="btn search-btn">搜索</button>
            </div>
            <div id="all-games-results" class="game-list"></div>
          </div>
        </div>

        <!-- 我的修改器 -->
        <div id="cheats" class="page hidden">
          <h2>我的修改器</h2>
          <div class="tab-bar">
            <button class="tab-btn active" data-tab="downloaded">已下载</button>
            <button class="tab-btn" data-tab="downloading">下载列表</button>
          </div>
          <div id="downloaded" class="tab-pane">
            <div id="downloaded-files-list" class="installed-tools-list"></div>
          </div>
          <div id="downloading" class="tab-pane hidden">
            <div class="download-list-header">
              <div class="download-list-stats">
                <span id="download-stats-text">暂无任务</span>
              </div>
              <div class="download-list-actions">
                <button id="clear-all-tasks-btn" class="btn btn-danger">移除全部下载记录</button>
              </div>
            </div>
            <div id="download-tasks-list" class="download-tasks-list"></div>
          </div>
        </div>

        <!-- 设置 -->
        <div id="settings" class="page hidden">
          <h2>设置</h2>
          <div class="settings-section pinned-top">
            <h3>下载设置</h3>
            <div class="setting-item">
              <label for="download-folder">下载文件夹:</label>
              <input type="text" id="download-folder" placeholder="请选择下载文件夹路径" />
              <button id="select-folder-btn" class="btn">选择文件夹</button>
              <button id="open-folder-btn" class="btn">打开文件夹</button>
              <p class="setting-description">所有下载任务的文件都会保存到此文件夹，应用的文件管理功能（如查看、打开、删除）也基于此目录。</p>
            </div>
          </div>

          <div class="settings-section">
            <h3>常规</h3>
            <div class="setting-item">
              <label class="checkbox-label">
                <input type="checkbox" id="minimize-to-tray" />
                关闭时最小化到托盘
              </label>
              <p class="setting-description">开启后，点击关闭按钮将隐藏到系统托盘继续运行（下载不中断），可从托盘图标还原窗口；关闭则点击关闭直接退出。</p>
            </div>
          </div>

          <div class="settings-section">
            <h3>软件更新</h3>
            <div class="setting-item">
              <label>当前版本:</label>
              <span id="update-current-version" class="update-version-text">-</span>
              <button id="check-update-btn" class="btn">检查更新</button>
              <span id="update-check-status" class="setting-description-inline"></span>
            </div>
            <div class="setting-item update-option-item">
              <label class="checkbox-label">
                <input type="checkbox" id="auto-check-update" />
                启动时自动检查更新
              </label>
              <p class="setting-description">仅在启动时联网检查新版本并提示，不会自动下载。</p>
            </div>

            <div id="update-card" class="update-card hidden">
              <div class="update-card-header">
                <span class="update-new-version" id="update-latest-version"></span>
                <span class="update-release-date" id="update-release-date"></span>
                <a href="#" id="update-release-link" class="update-release-link">查看更新内容</a>
              </div>
              <div class="update-status-text" id="update-status-text"></div>
              <div class="task-progress-bar update-progress-bar">
                <div class="task-progress-fill" id="update-progress-fill" style="width: 0%"></div>
              </div>
              <div class="update-progress-info" id="update-progress-info"></div>
              <div class="update-error-text" id="update-error-text"></div>
              <div class="task-actions update-actions" id="update-actions"></div>
            </div>
          </div>
        </div>

        <!-- 关于 -->
        <div id="about" class="page hidden">
          <h2>关于本软件</h2>
          <div id="about-content"></div>
        </div>

        <!-- （隐藏页，仅用于跳转） -->
        <div id="website" class="page hidden"></div>
      </div>

      <!-- 自定义确认对话框 -->
      <div id="confirm-dialog-overlay" class="dialog-overlay hidden">
        <div class="dialog-container">
          <div class="dialog-header">
            <h3 id="confirm-dialog-title">确认操作</h3>
          </div>
          <div class="dialog-content">
            <p id="confirm-dialog-message"></p>
          </div>
          <div class="dialog-footer">
            <button id="confirm-dialog-cancel" class="btn btn-secondary">取消</button>
            <button id="confirm-dialog-confirm" class="btn btn-primary">确定</button>
          </div>
        </div>
      </div>

      <!-- 关闭行为询问对话框（用户未设置过关闭方式时由主进程触发） -->
      <div id="close-behavior-dialog-overlay" class="dialog-overlay hidden">
        <div class="dialog-container">
          <div class="dialog-header">
            <h3>关闭窗口</h3>
          </div>
          <div class="dialog-content">
            <p>你还没有设置过关闭方式，请选择点击关闭按钮时的行为：</p>
            <label class="checkbox-label dialog-remember-label">
              <input type="checkbox" id="close-behavior-remember" />
              记住选择，不再提醒
            </label>
          </div>
          <div class="dialog-footer">
            <button id="close-behavior-cancel" class="btn btn-secondary">取消</button>
            <button id="close-behavior-quit" class="btn btn-secondary">直接退出</button>
            <button id="close-behavior-tray" class="btn btn-primary">最小化到托盘</button>
          </div>
        </div>
      </div>

      <!-- 渲染进程脚本 -->
      <script type="module" src="./index.js"></script>
  </body>
</html>
